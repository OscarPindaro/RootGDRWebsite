repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: trailing-whitespace
    - id: check-added-large-files
      # Generated/committed artifacts: the editor bundle (see package.json) and
      # screenshots attached to problem write-ups under docs/.
      exclude: ^(src/frontend/static/js/editor\.js|docs/.*\.png)$
    - id: check-executables-have-shebangs
    - id: check-ast
    - id: check-symlinks
    - id: detect-aws-credentials
      args: ["--allow-missing-credentials"]
    - id: detect-private-key
    - id: end-of-file-fixer
    - id: name-tests-test
      args: ["--pytest-test-first"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/OscarPindaro/oscar-hooks
    rev: v0.1.3
    hooks:
      - id: pydantic-yaml-guard
        args: ['--config-files', 'src/backend/config.py', 'src/backend/config.py']
      - id: telegram-token-guard
  - repo: local
    hooks:
      - id: jinjax-css-dependencies
        name: Sync JinjaX CSS dependencies
        entry: uv run python -m pre_commits.jinjax_css_dependencies
        language: system
        files: \.jinja$
        pass_filenames: false
      - id: jinja-globals
        name: Check JinjaX globals, props and component references
        entry: uv run python -m pre_commits.jinja_globals
        language: system
        files: \.jinja$
        pass_filenames: false
      - id: route-links
        name: Check that every generated link resolves to a route
        entry: uv run python -m pre_commits.route_links
        language: system
        files: ^(src/frontend/components/.*\.jinja|src/backend/.*\.py)$
        pass_filenames: false
      - id: model-registry
        name: Sync db/registry.py with model classes
        entry: uv run python -m pre_commits.model_registry
        language: system
        pass_filenames: false
        always_run: true
      - id: session-commit-guard
        name: Ban direct database session commits
        entry: >-
          uv run python -m pre_commits.session_commit_guard
          --exclude-file src/backend/dependencies.py
          --exclude-file src/backend/db/db.py
        language: system
        files: \.py$
