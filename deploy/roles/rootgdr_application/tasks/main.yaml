---
- name: Require explicit private deployment and encrypted recovery inputs
  ansible.builtin.assert:
    that:
      - rootgdr is defined
      - rootgdr_artifact_file is defined
      - rootgdr_backup_storage_file is defined
      - rootgdr_backup_receipt_file is defined
      - rootgdr_controller_command is defined
      - rootgdr_controller_backup_command is defined

- name: Validate configuration, selected commit and the recorded passing tests
  ansible.builtin.command:
    argv: "{{ rootgdr_controller_command + ['plan', '--artifact', rootgdr_artifact_file] }}"
    stdin: "{{ rootgdr | to_json }}"
    chdir: "{{ playbook_dir }}/.."
  delegate_to: localhost
  register: rootgdr_planning
  changed_when: false
  check_mode: false
  no_log: true

- name: Retain only the validated nonsecret deployment plan
  ansible.builtin.set_fact:
    rootgdr_plan: "{{ rootgdr_planning.stdout | from_json }}"
  no_log: true

- name: Run the locked manual rollout
  ansible.builtin.include_tasks: operation.yaml
  when: not ansible_check_mode
