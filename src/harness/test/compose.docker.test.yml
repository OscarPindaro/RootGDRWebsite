services:
  db:
    image: postgres:18
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backend_test}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      MIGRATOR_DB_USER: ${MIGRATOR__USER:-migrator_user}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR__PASSWORD:-migrator_password}
      APP_DB_USER: ${DATABASE__USER:-app_user}
      APP_DB_PASSWORD: ${DATABASE__PASSWORD:-app_password}
    ports:
      - "${HARNESS_DB_PORT:-5432}:5432"
    volumes:
      - ${HARNESS_REPO_ROOT}/deploy/init_db.sh:/docker-entrypoint-initdb.d/init_db.sh:z
      - ${HARNESS_REPO_ROOT}/deploy/init_db.sql:/opt/init_db.sql:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-backend_test}"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ${HARNESS_REPO_ROOT}
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${HARNESS_ENV_FILE}
    ports:
      - "${HARNESS_BACKEND_PORT}:8000"
    volumes:
      # ``:z`` relabels the bind mount for SELinux (Fedora/RHEL). Without it
      # the app cannot read the mounted config and silently falls back to
      # config defaults (database host ``localhost``).
      - ${HARNESS_REPO_ROOT}/src:/app/src:z
      - ${HARNESS_REPO_ROOT}/alembic:/app/alembic:z
      - ${HARNESS_REPO_ROOT}/harness-artifacts:/app/harness-artifacts:z
      - ${HARNESS_CONFIG_FILE}:/app/config.yaml:ro,z
      - uploads:/app/data
    # The installed distribution is ``backend`` (from ``src/``); ``src.backend``
    # is not importable in the container, so launch the package directly.
    # ``HARNESS_BACKEND_RELOAD`` carries ``--reload`` (and the ``__pycache__``
    # excludes) when the environment reloads, and is empty otherwise.
    command: >
      sh -c "uv run --no-sync uvicorn backend.server:app --host 0.0.0.0 --port 8000 ${HARNESS_BACKEND_RELOAD:-}"

volumes:
  uploads:
