# Application path → prototype page, for `harness compare`.
#
# The patterns are matched in order against the application path; the first
# match wins. Placeholder segments are `[^/]+`, so a UUID world id matches.
# Landmarks are optional semantic elements measured on both sides for the
# structural (DOM/geometry) section of the compare report.
entries:
  - pattern: "^/worlds$"
    prototype: index.html
    label: Worlds list
  - pattern: "^/worlds/[^/]+$"
    prototype: mondo.html
    label: World overview
    landmarks:
      rail:
        app: ".rail"
        prototype: ".rail"
        # The rail is a closed drawer on phone; being offscreen is expected.
        hidden_on: [phone]
      container:
        app: ".container"
        prototype: ".container"
      masthead:
        app: ".masthead"
        prototype: ".masthead"
      quick_strip:
        app: ".grid-flush"
        prototype: ".grid--quick"
  - pattern: "^/worlds/[^/]+/characters$"
    prototype: personaggi.html
    label: Characters list
  - pattern: "^/worlds/[^/]+/characters/[^/]+$"
    prototype: personaggio.html
    label: Character detail
    landmarks:
      container:
        app: ".container"
        prototype: ".container"
      docbar:
        app: ".docbar"
        prototype: ".docbar"
      document:
        app: ".document"
        prototype: ".document"
      face:
        app: ".document__face"
        prototype: ".document__face"
  - pattern: "^/worlds/[^/]+/npcs$"
    prototype: npc.html
    label: NPCs list
  - pattern: "^/worlds/[^/]+/places$"
    prototype: luoghi.html
    label: Places atlas
  - pattern: "^/worlds/[^/]+/places/[^/]+$"
    prototype: luogo.html
    label: Place detail
  - pattern: "^/worlds/[^/]+/sessions$"
    prototype: sessioni.html
    label: Sessions ledger
  - pattern: "^/worlds/[^/]+/sessions/[^/]+$"
    prototype: sessione.html
    label: Session detail
  - pattern: "^/worlds/[^/]+/stories$"
    prototype: storie.html
    label: Stories list
  - pattern: "^/worlds/[^/]+/stories/[^/]+$"
    prototype: storia.html
    label: Story detail
  - pattern: "^/worlds/[^/]+/pages$"
    prototype: pagine.html
    label: Pages list
  - pattern: "^/worlds/[^/]+/pages/[^/]+$"
    prototype: pagina.html
    label: Page detail
