<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuova storia — Fronte del Tuono</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body data-page="storie" data-world="fronte-del-tuono" data-nav="storie"
      data-crumbs="I tuoi mondi::mondi.html|Fronte del Tuono::mondo.html|Storie::storie.html|Nuova storia">

  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="content" style="max-width:760px">
        <div class="page-head">
          <div>
            <span class="eyebrow">Storie · solo Master</span>
            <h1>Nuova storia</h1>
            <p>Un evento ampio o un resoconto, diverso da una singola sessione giocata.</p>
          </div>
        </div>

        <form class="form" onsubmit="event.preventDefault(); location.href='storia.html';">
          <div class="field">
            <label for="titolo">Titolo</label>
            <input id="titolo" required placeholder="es. Il patto delle quattro querce">
          </div>
          <div class="field">
            <label for="sommario">Sommario breve</label>
            <input id="sommario" required placeholder="Una o due frasi che riassumono l'evento">
          </div>
          <div class="field">
            <label for="corpo">Testo</label>
            <div class="editor">
              <div class="editor-bar">
                <button type="button" class="tool">B</button>
                <button type="button" class="tool">I</button>
                <button type="button" class="tool">H</button>
                <button type="button" class="tool">•</button>
                <span class="spacer"></span><span class="small muted">Markdown</span>
              </div>
              <textarea id="corpo" spellcheck="false" placeholder="Racconta l'evento…"></textarea>
            </div>
          </div>
          <div style="display:flex;gap:.5rem">
            <button class="btn btn-primary" type="submit">Salva storia</button>
            <a class="btn btn-ghost" href="storie.html">Annulla</a>
          </div>
        </form>
      </main>
    </div>
  </div>

</body>
</html>
