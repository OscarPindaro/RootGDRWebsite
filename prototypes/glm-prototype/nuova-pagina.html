<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuova pagina — Fronte del Tuono</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body data-page="pagine" data-world="fronte-del-tuono" data-nav="pagine"
      data-crumbs="I tuoi mondi::mondi.html|Fronte del Tuono::mondo.html|Pagine::pagine.html|Nuova pagina">

  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="content" style="max-width:760px">
        <div class="page-head">
          <div>
            <span class="eyebrow">Pagine · solo Master</span>
            <h1>Nuova pagina</h1>
            <p>Lo slug deve essere unico all'interno di questo mondo.</p>
          </div>
        </div>

        <form class="form" onsubmit="event.preventDefault(); location.href='pagina.html';">
          <div class="field">
            <label for="titolo">Titolo</label>
            <input id="titolo" required placeholder="es. Fazioni">
          </div>
          <div class="field">
            <label for="slug">Slug</label>
            <input id="slug" required placeholder="es. fazioni" pattern="[a-z0-9-]+">
            <span class="hint">Solo minuscole, numeri e trattini.</span>
          </div>
          <div class="field">
            <label for="pos">Posizione nel menu</label>
            <input id="pos" type="number" min="0" value="5">
            <span class="hint">Numeri più bassi compaiono prima nella sidebar.</span>
          </div>
          <div class="field">
            <label for="corpo">Contenuto</label>
            <div class="editor">
              <div class="editor-bar">
                <button type="button" class="tool">B</button>
                <button type="button" class="tool">I</button>
                <button type="button" class="tool">H</button>
                <button type="button" class="tool">•</button>
                <span class="spacer"></span><span class="small muted">Markdown</span>
              </div>
              <textarea id="corpo" spellcheck="false" placeholder="Scrivi il materiale di riferimento…"></textarea>
            </div>
          </div>
          <div style="display:flex;gap:.5rem">
            <button class="btn btn-primary" type="submit">Salva pagina</button>
            <a class="btn btn-ghost" href="pagine.html">Annulla</a>
          </div>
        </form>
      </main>
    </div>
  </div>

</body>
</html>
