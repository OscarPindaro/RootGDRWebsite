<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuova sessione — Fronte del Tuono</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body data-page="sessioni" data-world="fronte-del-tuono" data-nav="sessioni"
      data-crumbs="I tuoi mondi::mondi.html|Fronte del Tuono::mondo.html|Sessioni::sessioni.html|Nuova sessione">

  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="content" style="max-width:760px">
        <div class="page-head">
          <div>
            <span class="eyebrow">Sessioni · solo Master</span>
            <h1>Nuova sessione</h1>
            <p>La data nel mondo è obbligatoria; la data reale è opzionale e serve per l'ordinamento.</p>
          </div>
        </div>

        <form class="form" onsubmit="event.preventDefault(); location.href='sessione.html';">
          <div class="field">
            <label for="titolo">Titolo</label>
            <input id="titolo" required placeholder="es. La strada per Bracken">
          </div>
          <div class="field">
            <label for="data-mondo">Data nel mondo</label>
            <input id="data-mondo" required placeholder="es. «Terza luna di Fogliame»">
            <span class="hint">Testo libero: puoi usare il calendario che preferisci.</span>
          </div>
          <div class="field">
            <label for="data-reale">Data reale <span class="muted small">(opzionale)</span></label>
            <input id="data-reale" type="date">
          </div>
          <div class="field">
            <label for="corpo">Resoconto</label>
            <div class="editor">
              <div class="editor-bar">
                <button type="button" class="tool">B</button>
                <button type="button" class="tool">I</button>
                <button type="button" class="tool">H</button>
                <button type="button" class="tool">•</button>
                <span class="spacer"></span><span class="small muted">Markdown</span>
              </div>
              <textarea id="corpo" spellcheck="false" placeholder="Cosa è successo, chi era presente, cosa resta aperto…"></textarea>
            </div>
          </div>
          <div style="display:flex;gap:.5rem">
            <button class="btn btn-primary" type="submit">Salva sessione</button>
            <a class="btn btn-ghost" href="sessioni.html">Annulla</a>
          </div>
        </form>
      </main>
    </div>
  </div>

</body>
</html>
