<div class="study-bar" data-study-bar role="region" aria-label="Confronto prototipo">
  <p class="study-bar__notice">
    <strong>Prototipo.</strong> Dati dimostrativi; salvataggi simulati e
    disattivati. Nessuna modifica viene registrata. Confronto, non impostazione
    del prodotto.
  </p>
  <div class="study-bar__choices" role="group" aria-label="Punto di creazione">
    <button type="button" class="btn btn-secondary btn-sm btn-toggle btn-selected"
            data-study-entry-choice="a" aria-pressed="true">A · Scheda nel reticolo</button>
    <button type="button" class="btn btn-secondary btn-sm btn-toggle"
            data-study-entry-choice="b" aria-pressed="false">B · Azione sopra il reticolo</button>
  </div>
  <p class="study-bar__sizes">
    Collezione:
    <a href="/study/empty" data-study-size-link="empty">0</a> ·
    <a href="/study/short" data-study-size-link="short">3</a> ·
    <a href="/study/long" data-study-size-link="long">30</a>
  </p>
  <p class="study-bar__status" data-study-status role="status" aria-live="polite">
    Opzione A: la scheda di creazione chiude il reticolo. Stessi dati, stessi controlli.
  </p>
</div>
