<div class="study-bar" data-study-bar role="region" aria-label="Confronto prototipo">
  <p class="study-bar__notice">
    <strong>Prototipo.</strong> Dati dimostrativi; salvataggi simulati e
    disattivati. Nessuna modifica viene registrata. Confronto, non impostazione
    del prodotto. Il confronto vale per il telefono; il desktop resta identico.
  </p>
  <div class="study-bar__choices" role="group" aria-label="Controlli aspetto sul telefono">
    <button type="button" class="btn btn-secondary btn-sm btn-toggle btn-selected"
            data-study-appearance-choice="always" aria-pressed="true">A · Sempre visibili</button>
    <button type="button" class="btn btn-secondary btn-sm btn-toggle"
            data-study-appearance-choice="disclosure" aria-pressed="false">B · Dietro disclosure</button>
  </div>
  <p class="study-bar__metrics" data-study-metrics>
    Misura in corso…
  </p>
  <p class="study-bar__status" data-study-status role="status" aria-live="polite">
    A · Sempre visibili: ritratto, storico, animale e tinta sopra l'identità.
  </p>
</div>
